apiVersion: apps/v1
kind: Deployment

metadata:
  name: answer

spec:
  replicas: 3

  selector:
    matchLabels:
      app: answer

  template:
    metadata:
      labels:
        app: answer

    spec:
      containers:
        - name: answer
          image: ghcr.io/theb23/answer:v2
          ports:
            - containerPort: 80
          volumeMounts:
            - name: answer-storage
              mountPath: /data
      volumes:
        - name: answer-storage
          persistentVolumeClaim:
            claimName: answer-data
